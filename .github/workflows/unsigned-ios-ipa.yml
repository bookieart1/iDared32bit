name: Build unsigned development IPA

on:
  push:
    branches:
      - ci/unsigned-ipa-baseline
  workflow_dispatch:

# This workflow only needs to read the repository and upload its build artifact.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CMAKE: ${{ github.workspace }}/vendor/cmake/bin/cmake

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA on macOS
    # The app uses SwiftUI APIs from the iOS 26 SDK. macos-26 currently ships
    # with Xcode 26 as its default, while macos-15 still defaults to Xcode 16.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out the fork
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Show build tools
        run: |
          xcodebuild -version
          rustc --version
          cargo --version

      - name: Install the iOS Rust target
        run: rustup target add aarch64-apple-ios

      # SDL's current CMake project still needs the pre-CMake-4 compatibility
      # mode. This is the same known-good CMake release used by the repository's
      # existing macOS lint/test workflow.
      - name: Restore CMake 3.31.6
        id: cache-cmake
        uses: actions/cache@v6
        with:
          path: vendor/cmake
          key: cmake-3.31.6-macos-universal

      - name: Download CMake 3.31.6
        if: steps.cache-cmake.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl --fail --location \
            --output "$RUNNER_TEMP/cmake-3.31.6.tar.gz" \
            "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz"
          tar xzf "$RUNNER_TEMP/cmake-3.31.6.tar.gz" -C vendor
          mv vendor/cmake-3.31.6-macos-universal/CMake.app/Contents vendor/cmake

      - name: Verify CMake version
        run: |
          "$CMAKE" --version

      - name: Build the existing iOS app without signing
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project iphone/iDared32bit.xcodeproj \
            -scheme "iDared 32bit" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/iDared32bit.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify identity and package the unsigned IPA
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/iDared32bit.xcarchive/Products/Applications/iDared 32bit.app"
          EXPECTED_BUNDLE_ID="org.alexmartin.idared32bit"
          ACTUAL_BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw "$APP_PATH/Info.plist")"

          test -d "$APP_PATH"
          test "$ACTUAL_BUNDLE_ID" = "$EXPECTED_BUNDLE_ID"
          test ! -e "$APP_PATH/embedded.mobileprovision"

          if codesign -dv "$APP_PATH" >/dev/null 2>&1; then
            echo "The app was unexpectedly signed."
            exit 1
          fi

          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/

          (
            cd build
            /usr/bin/zip -qry iDared32bit-unsigned.ipa Payload
          )

          test -s build/iDared32bit-unsigned.ipa
          shasum -a 256 build/iDared32bit-unsigned.ipa

      - name: Upload the unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: iDared32bit-unsigned-${{ github.sha }}
          path: build/iDared32bit-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
